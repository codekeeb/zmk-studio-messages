syntax = "proto3";

package zmk.lighting;

// CODEKEEB PATCH: upstream ZMK Studio only speaks core/behaviors/keymap,
// so a client can edit the keymap but cannot touch the lighting or the
// displays. This subsystem exposes both, and every change goes through
// the same path a key press takes -- so it is saved to flash and pushed
// to the peripheral half exactly the same way.
message Request {
    oneof request_type {
        bool get_state = 1;

        // RGB. Absolute values: a slider says "brightness = 3" rather
        // than stepping there one command at a time.
        SetRgbRequest set_rgb = 2;

        // OLED animation, by index into the shield's own list.
        uint32 set_animation = 3;
    }
}

message Response {
    oneof response_type {
        State get_state = 1;
        bool set_rgb = 2;
        bool set_animation = 3;
    }
}

// Only the fields that are present are applied, so a client can change
// just the brightness without having to send the whole state back.
message SetRgbRequest {
    optional bool active = 1;
    optional uint32 brightness = 2;   // 1..brightness_max
    optional uint32 effect = 3;       // index into the effect list
    optional uint32 hue = 4;          // 0..359
    optional uint32 speed = 5;        // 0..4
}

message State {
    bool rgb_available = 1;
    bool active = 2;
    uint32 brightness = 3;
    uint32 brightness_max = 4;
    uint32 effect = 5;
    uint32 effect_count = 6;
    uint32 hue = 7;
    uint32 speed = 8;

    bool animation_available = 9;
    uint32 animation = 10;
    uint32 animation_count = 11;
}
