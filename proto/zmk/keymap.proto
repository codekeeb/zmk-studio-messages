syntax = "proto3";

package zmk.keymap;

message Request {
    oneof request_type {
        bool get_keymap = 1;
        SetLayerBindingRequest set_layer_binding = 2;
        bool check_unsaved_changes = 3;
        bool save_changes = 4;
        bool discard_changes = 5;
        bool get_physical_layouts = 6;
        uint32 set_active_physical_layout = 7;
        MoveLayerRequest move_layer = 8;
        AddLayerRequest add_layer = 9;
        RemoveLayerRequest remove_layer = 10;
        RestoreLayerRequest restore_layer = 11;
        SetLayerPropsRequest set_layer_props = 12;
        // CODEKEEB PATCH: read/write sensor (encoder) rotation bindings.
        // Upstream ZMK/Studio has no equivalent -- sensor-bindings are
        // compile-time only, and get_keymap's response never included
        // them. Kept as separate requests (rather than folded into
        // get_keymap/Layer) so the upstream get_keymap handler in
        // app/src/studio/keymap_subsystem.c doesn't need to change --
        // this whole feature stays a self-contained addition.
        bool get_sensor_bindings = 99;
        SetSensorBindingRequest set_sensor_binding = 100;
        // CODEKEEB PATCH: runtime-editable macro slots (&dmac).
        bool get_macros = 101;
        SetMacroRequest set_macro = 102;
        SetUnicodeModeRequest set_unicode_mode = 103;
    }
}

message Response {
    oneof response_type {
        Keymap get_keymap = 1;
        SetLayerBindingResponse set_layer_binding = 2;
        bool check_unsaved_changes = 3;
        SaveChangesResponse save_changes = 4;
        bool discard_changes = 5;
        PhysicalLayouts get_physical_layouts = 6;
        SetActivePhysicalLayoutResponse set_active_physical_layout = 7;
        MoveLayerResponse move_layer = 8;
        AddLayerResponse add_layer = 9;
        RemoveLayerResponse remove_layer = 10;
        RestoreLayerResponse restore_layer = 11;
        SetLayerPropsResponse set_layer_props = 12;
        // CODEKEEB PATCH: see get_sensor_bindings/set_sensor_binding above.
        GetSensorBindingsResponse get_sensor_bindings = 99;
        SetSensorBindingResponse set_sensor_binding = 100;
        GetMacrosResponse get_macros = 101;
        SetMacroResponse set_macro = 102;
        SetMacroResponse set_unicode_mode = 103;
    }
}

message Notification {
    oneof notification_type {
        bool unsaved_changes_status_changed = 1;
    }
}

message SaveChangesResponse {
    oneof result {
        bool ok = 1;
        SaveChangesErrorCode err = 2;
    }
}

enum SaveChangesErrorCode {
    SAVE_CHANGES_ERR_OK = 0;
    SAVE_CHANGES_ERR_GENERIC = 1;
    SAVE_CHANGES_ERR_NOT_SUPPORTED = 2;
    SAVE_CHANGES_ERR_NO_SPACE = 3;
}

enum SetLayerBindingResponse {
    SET_LAYER_BINDING_RESP_OK = 0;
    SET_LAYER_BINDING_RESP_INVALID_LOCATION = 1;
    SET_LAYER_BINDING_RESP_INVALID_BEHAVIOR = 2;
    SET_LAYER_BINDING_RESP_INVALID_PARAMETERS = 3;
}

// CODEKEEB PATCH: sensor (encoder) rotation binding write support.
message SetSensorBindingRequest {
    uint32 layer_id = 1;
    uint32 sensor_index = 2;
    // true = clockwise binding, false = counter-clockwise binding.
    bool clockwise = 3;

    BehaviorBinding binding = 4;
}

enum SetSensorBindingResponse {
    SET_SENSOR_BINDING_RESP_OK = 0;
    SET_SENSOR_BINDING_RESP_INVALID_LOCATION = 1;
    SET_SENSOR_BINDING_RESP_INVALID_BEHAVIOR = 2;
    SET_SENSOR_BINDING_RESP_INVALID_PARAMETERS = 3;
    SET_SENSOR_BINDING_RESP_NOT_SUPPORTED = 4;
}

message SetActivePhysicalLayoutResponse {
    oneof result {
        Keymap ok = 1;
        SetActivePhysicalLayoutErrorCode err = 2;
    }
}

enum MoveLayerErrorCode {
    MOVE_LAYER_ERR_OK = 0;
    MOVE_LAYER_ERR_GENERIC = 1;
    MOVE_LAYER_ERR_INVALID_LAYER = 2;
    MOVE_LAYER_ERR_INVALID_DESTINATION = 3;
}

message MoveLayerResponse {
    oneof result {
        Keymap ok = 1;
        MoveLayerErrorCode err = 2;
    }
}

message AddLayerResponse {
    oneof result {
        AddLayerResponseDetails ok = 1;
        AddLayerErrorCode err = 2;
    }
}

enum AddLayerErrorCode {
    ADD_LAYER_ERR_OK = 0;
    ADD_LAYER_ERR_GENERIC = 1;
    ADD_LAYER_ERR_NO_SPACE = 2;
}

message AddLayerResponseDetails {
    uint32 index = 1;
    Layer layer = 2;
}

message RemoveLayerResponse {
    oneof result {
        RemoveLayerOk ok = 1;
        RemoveLayerErrorCode err = 2;
    }
}

message RemoveLayerOk {
}

enum RemoveLayerErrorCode {
    REMOVE_LAYER_ERR_OK = 0;
    REMOVE_LAYER_ERR_GENERIC = 1;
    REMOVE_LAYER_ERR_INVALID_INDEX = 2;
}

message RestoreLayerResponse {
    oneof result {
        Layer ok = 1;
        RestoreLayerErrorCode err = 2;
    }
}

enum RestoreLayerErrorCode {
    RESTORE_LAYER_ERR_OK = 0;
    RESTORE_LAYER_ERR_GENERIC = 1;
    RESTORE_LAYER_ERR_INVALID_ID = 2;
    RESTORE_LAYER_ERR_INVALID_INDEX = 3;
}

enum SetLayerPropsResponse {
    SET_LAYER_PROPS_RESP_OK = 0;
    SET_LAYER_PROPS_RESP_ERR_GENERIC = 1;
    SET_LAYER_PROPS_RESP_ERR_INVALID_ID = 2;
}

enum SetActivePhysicalLayoutErrorCode {
    SET_ACTIVE_PHYSICAL_LAYOUT_ERR_OK = 0;
    SET_ACTIVE_PHYSICAL_LAYOUT_ERR_GENERIC = 1;
    SET_ACTIVE_PHYSICAL_LAYOUT_ERR_INVALID_LAYOUT_INDEX = 2;
}

message SetLayerBindingRequest {
    uint32 layer_id = 1;
    int32 key_position = 2;

    BehaviorBinding binding = 3;
}

message MoveLayerRequest {
    uint32 start_index = 1;
    uint32 dest_index = 2;
}

message AddLayerRequest {
}

message RemoveLayerRequest {
    uint32 layer_index = 1;
}

message RestoreLayerRequest {
    uint32 layer_id = 1;
    uint32 at_index = 2;
}

message SetLayerPropsRequest {
    uint32 layer_id = 1;
    string name = 2;
}

message Keymap {
    repeated Layer layers = 1;
    uint32 available_layers = 2;
    uint32 max_layer_name_length = 3;
}

message Layer {
    uint32 id = 1;
    string name = 2;
    repeated BehaviorBinding bindings = 3;
}

message BehaviorBinding {
    sint32 behavior_id = 1;
    uint32 param1 = 2;
    uint32 param2 = 3;
}

// CODEKEEB PATCH: one entry per (layer, physical sensor) pair that has a
// runtime-editable rotation binding (see set_sensor_binding), each
// holding both its clockwise and counter-clockwise binding. Returned by
// get_sensor_bindings; upstream ZMK never exposed sensor-bindings over
// Studio in any form.
message SensorBinding {
    uint32 layer_id = 1;
    uint32 sensor_index = 2;
    BehaviorBinding clockwise = 3;
    BehaviorBinding counter_clockwise = 4;
}

message GetSensorBindingsResponse {
    repeated SensorBinding sensor_bindings = 1;
}

message PhysicalLayouts {
    uint32 active_layout_index = 1;
    repeated PhysicalLayout layouts = 2;
}

message PhysicalLayout {
    string name = 1;
    repeated KeyPhysicalAttrs keys = 2;
}

message KeyPhysicalAttrs {
    sint32 width = 1;
    sint32 height = 2;
    sint32 x = 3;
    sint32 y = 4;
    sint32 r = 5;
    sint32 rx = 6;
    sint32 ry = 7;
}
// CODEKEEB PATCH: runtime-editable macros. ZMK's own macros are devicetree
// nodes fixed at build time; these slots live in flash and are authored
// from the keymap editor.

// type: 0 = tap an encoded HID keycode, 1 = emit a Unicode codepoint,
// 2 = wait `value` milliseconds.
message MacroStep {
    uint32 type = 1;
    uint32 value = 2;
}

message Macro {
    uint32 slot = 1;
    repeated MacroStep steps = 2;
}

// steps is a packed byte blob rather than a repeated field on purpose:
// ZMK's RPC layer calls pb_decode() directly, with no hook to install the
// decode callback nanopb requires for repeated fields, so a repeated field
// would silently arrive empty. Layout: 5 bytes per step, little-endian --
// 1 byte type, 4 bytes value.
message SetMacroRequest {
    uint32 slot = 1;
    bytes steps = 2;
}

enum SetMacroResponse {
    SET_MACRO_RESP_OK = 0;
    SET_MACRO_RESP_INVALID_SLOT = 1;
    SET_MACRO_RESP_TOO_LONG = 2;
    SET_MACRO_RESP_NOT_SUPPORTED = 3;
}

// 0 = Linux (Ctrl+Shift+U), 1 = Windows/WinCompose (RAlt+U),
// 2 = macOS (Unicode Hex Input).
message SetUnicodeModeRequest {
    uint32 mode = 1;
}

message GetMacrosResponse {
    repeated Macro macros = 1;
    uint32 unicode_mode = 2;
    uint32 max_steps = 3;
}
